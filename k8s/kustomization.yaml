# Alternative to scripts/deploy.sh:  kubectl apply -k k8s/
# (create the Secret first - see docs/DEPLOYMENT.md; secret.yaml is a template and is not listed here.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: country-info

resources:
  - namespace.yaml
  - configmap.yaml
  - mysql-statefulset.yaml
  - app-deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

images:
  - name: country-info-service
    newTag: "1.0.0"
