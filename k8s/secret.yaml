# TEMPLATE ONLY - DO NOT COMMIT REAL VALUES.
#
# scripts/deploy.sh creates this Secret for you (from env vars, or random values on first
# deploy) and never overwrites an existing one, because changing the MySQL password after
# the data directory is initialised would lock the app out.
#
# In a real environment the values come from a secret manager (External Secrets Operator,
# Sealed Secrets, Vault, cloud KMS), never from Git.
apiVersion: v1
kind: Secret
metadata:
  name: country-info-secrets
  labels:
    app.kubernetes.io/part-of: country-info
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "countryinfo"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME"
  MYSQL_ROOT_PASSWORD: "CHANGE_ME"
