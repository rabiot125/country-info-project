apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-info-service
  labels:
    app.kubernetes.io/name: country-info-service
    app.kubernetes.io/part-of: country-info
spec:
  replicas: 2
  revisionHistoryLimit: 5          # keeps history for `kubectl rollout undo`
  selector:
    matchLabels:
      app.kubernetes.io/name: country-info-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never drop below current capacity during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: country-info-service
        app.kubernetes.io/part-of: country-info
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Must exceed preStop sleep (5s) + Spring graceful shutdown (SHUTDOWN_TIMEOUT 20s).
      terminationGracePeriodSeconds: 35
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Spread replicas across nodes. ScheduleAnyway so single-node clusters (minikube)
      # still schedule both pods; on multi-node clusters the scheduler honours the spread.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: country-info-service

      # Waits for MySQL's port before the JVM starts. Without it the first deploy shows
      # several CrashLoopBackOff restarts (Flyway fails while MySQL initialises), which
      # adds exponential back-off delay and hides real crashes. It only checks TCP: bad
      # credentials still fail the app loudly, which is what we want for config errors.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                nc -z -w 2 mysql 3306 && echo "mysql is reachable" && exit 0
                echo "waiting for mysql ($i/60)"; sleep 2
              done
              echo "mysql not reachable after 120s"; exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }

      containers:
        - name: app
          image: country-info-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: country-info-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: country-info-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: country-info-secrets
                  key: SPRING_DATASOURCE_PASSWORD

          # Startup covers JVM boot + Flyway: up to 5 + 30x5 = 155s before liveness takes over.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          # Liveness = "is the JVM wedged?" Never depends on DB or upstream.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness = "can I serve traffic?" Includes the DB, excludes the SOAP circuit.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              # Gives kube-proxy / ingress time to remove the endpoint before Tomcat stops
              # accepting connections, so no in-flight requests are dropped on rollout.
              # exec form works on every Kubernetes version (the native sleep action needs 1.30+).
              exec:
                command: ["sleep", "5"]

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi        # heap = 75% (MaxRAMPercentage); no CPU limit to avoid throttling

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
